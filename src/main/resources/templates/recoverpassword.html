<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinControl - Recuperar Senha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="main-wrapper">
    <div class="brand-side">
        <div class="brand-logo">
            <i class="fa-solid fa-chart-line"></i>
            <span>FinControl</span>
        </div>
        <div class="brand-content">
            <h1>Recuperação de Acesso</h1>
            <p>Enviaremos as instruções de redefinição para o e-mail cadastrado.</p>
            <div class="piggy-animation-wrapper">
                <div class="piggy-icon">
                    <i class="fa-solid fa-key"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="form-side">
        <div class="form-header">
            <h2>Esqueceu sua senha?</h2>
            <p>Digite seu e-mail para receber as instruções</p>
        </div>

        <!-- Alertas de Erro e Sucesso -->
        <div th:if="${message}" style="color: #10b981; background: rgba(16, 185, 129, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; text-align: center;">
            <span th:text="${message}"></span>
        </div>

        <form th:action="@{/recoverpassword}" method="post">
            <div class="input-group">
                <label for="email">E-mail Cadastrado</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>
            </div>

            <button type="submit" class="btn-primary">Enviar Instruções</button>

            <div class="form-links">
                <p><a th:href="@{/login}">Lembrei minha senha (Voltar)</a></p>
            </div>
        </form>
    </div>
</div>

</body>
</html>
