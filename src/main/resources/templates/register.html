<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinControl - Criar Conta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="main-wrapper">
    <div class="brand-side">
        <div class="brand-logo">
            <i class="fa-solid fa-chart-line"></i>
            <span>FinControl</span>
        </div>
        <div class="brand-content">
            <h1>Crie sua conta. Comece a gerenciar hoje.</h1>
            <p>Junte-se a nós e tenha controle total sobre suas finanças pessoais e empresariais.</p>
            <div class="piggy-animation-wrapper">
                <div class="piggy-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="form-side">
        <div class="form-header">
            <h2>Criar Conta</h2>
            <p>Preencha os dados abaixo para se cadastrar</p>
        </div>

        
        <div th:if="${error}" style="color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; text-align: center;">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" method="post">
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
                </div>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="email" required>
                </div>
            </div>

            <div class="input-group">
                <label for="cpf">CPF</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmarSenha">Confirmar Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-shield-halved"></i>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-primary">Finalizar Cadastro</button>

            <div class="form-links">
                <p>Já possui uma conta? <a th:href="@{/login}">Voltar ao Login</a></p>
            </div>
        </form>
    </div>
</div>

</body>
</html>
